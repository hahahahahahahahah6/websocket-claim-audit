[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "websocket-claim-audit"
version = "0.1.0"
description = "Offline static audit of documented framed socket capabilities"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.scripts]
websocket-claim-audit = "websocket_claim_audit:main"

[tool.setuptools.packages.find]
include = ["websocket_claim_audit*"]
